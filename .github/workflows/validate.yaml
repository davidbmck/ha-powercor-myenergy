name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  standalone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python tools/build_release.py
      - name: Check tag and manifest alignment
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python tools/build_release.py --tag "$RELEASE_TAG"
      - uses: actions/upload-artifact@v4
        with:
          name: powercor-myenergy-release
          path: dist/powercor_myenergy.zip
          if-no-files-found: error
  home-assistant:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version: ['2026.10.4', 'stable']
    steps:
      - uses: actions/checkout@v4
      - run: docker pull ghcr.io/home-assistant/home-assistant:${{ matrix.version }}
      - run: python tools/test_ha.py --image ghcr.io/home-assistant/home-assistant:${{ matrix.version }}
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          comment: false
